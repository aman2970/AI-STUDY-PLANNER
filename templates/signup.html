<!DOCTYPE html>
<html>

<head>

    <title>Signup - AI Study Planner</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <h1>Sign Up</h1>

    <div class="login-form">

        <label>Name:</label>

        <input
            type="text"
            id="signup-name"
            placeholder="Enter your name"
        >

        <br><br>


        <label>Email:</label>

        <input
            type="email"
            id="signup-email"
            placeholder="Enter your email"
        >

        <br><br>


        <label>Password:</label>

        <input
            type="password"
            id="signup-password"
            placeholder="Enter your password"
        >

        <br><br>


        <button
            type="button"
            id="signup-button"
        >
            Sign Up
        </button>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
